name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reusable from release.yml — required by `uses: ./.github/workflows/ci.yml`.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      # Node 24 major. GitHub removed the Node 20 action runtime from
      # hosted runners on 2026-09-23; checkout@v4 was a Node 20 action.
      - uses: actions/checkout@v7

      - name: Install Cyrius toolchain
        # Through cyrius's own installer, fetched from the PINNED tag rather
        # than main, so the script is the one that release shipped. It
        # refuses a tarball whose published .sha256 is missing or does not
        # match, and checks the Ed25519-signed SHA256SUMS when a trusted
        # verifier is already installed. Until 1.1.0 this step unpacked the
        # tarball with no check at all. The pin is cyrius.cyml's
        # [package].cyrius, never hardcoded here.
        shell: bash
        run: |
          set -eo pipefail
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -m1 '^cyrius *= *"' cyrius.cyml | sed 's/.*"\(.*\)".*/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSfL "https://raw.githubusercontent.com/MacCracken/cyrius/$CYRIUS_VERSION/scripts/install.sh" \
            -o "$RUNNER_TEMP/cyrius-install.sh"
          CYRIUS_VERSION="$CYRIUS_VERSION" sh "$RUNNER_TEMP/cyrius-install.sh"
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
          echo "CYRIUS_HOME=$HOME/.cyrius" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        # cyrius.lock is a real integrity record (since 1.0.12): one sha256
        # per vendored stdlib file plus a `cyrius <pin>` trailer. Under an
        # unchanged pin, `cyrius deps` refuses any stdlib file whose snapshot
        # no longer matches the lock (cyrius 6.6.4 guard; only `--relock`
        # accepts it), so a toolchain tarball whose stdlib changed under the
        # same tag fails here rather than building. `--verify` then checks
        # lib/ against the committed lock. The old `--no-lock` flag worked
        # around cyrius 6.0.1 truncating the lock to 0 bytes; that was fixed
        # in 6.0.2, and on 6.6.x every build / test / distlib run rewrites
        # a stub lock anyway.
        run: |
          cyrius deps
          cyrius deps --verify

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Smoke banner names VERSION
        # The banner reads CYRIUS_PKG_VERSION (1.1.0); through 1.0.13 it was a
        # literal that still said 1.0.12. Fails if it drifts from VERSION again.
        shell: bash
        run: |
          set -eo pipefail
          want="niyama $(tr -d '[:space:]' < VERSION) - "
          got="$(./build/${{ github.event.repository.name }})"
          case "$got" in
            "$want"*) echo "$got" ;;
            *) echo "banner '$got' does not start with '$want'"; exit 1 ;;
          esac

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test

      - name: Fuzz
        # Gating since 1.1.0: every fuzz/*.fcyr harness must pass (it exits 1
        # on a failed assertion; a crash fails the step too).
        run: cyrius fuzz

      - name: Format check
        # Gating since 1.1.0. `cyrius fmt --check` exits 1 and names the first
        # non-canonical line. Every source the repo owns; an unmatched glob
        # stays literal under bash and fails on the missing file, so a moved
        # directory cannot turn this green by matching nothing.
        shell: bash
        run: |
          set -eo pipefail
          fail=0
          for f in src/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr fuzz/*.fcyr; do
            cyrius fmt --check "$f" || fail=1
          done
          exit "$fail"

      - name: Lint (advisory)
        # Advisory: `cyrius lint` reports over-long lines and untracked
        # deferral notes that are accepted for now (roadmap § Maintenance,
        # "cyrius audit exits 1"). Printed for review, never gating.
        continue-on-error: true
        shell: bash
        run: |
          for f in src/*.cyr; do cyrius lint "$f"; done

      - name: Raw-include check
        # `cyrius test` auto-prepends the manifest's [deps] stdlib, so it
        # would compile tests/niyama_raw_include.tcyr even against a bundle
        # with no requires block. `--no-deps` skips that prepend: this step
        # proves `include "dist/niyama.cyr"` alone compiles (1.0.13).
        run: |
          mkdir -p build
          cyrius build --no-deps tests/niyama_raw_include.tcyr build/raw_include
          ./build/raw_include
