name: Release

on:
  push:
    # Accept both `v1.2.3` and `1.2.3` tag styles. The version-verify
    # step below enforces semver shape + match against VERSION file.
    # Mirrors sandhi's release pattern.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      # All actions here are on their Node 24 majors (checkout v7,
      # upload-artifact v7, download-artifact v8, action-gh-release v3).
      # GitHub removed the Node 20 action runtime from hosted runners on
      # 2026-09-23, and every @v4 / @v2 tag this file used was Node 20.
      - uses: actions/checkout@v7

      - name: Verify version
        # Two-way sync gate: VERSION ↔ git tag. niyama doesn't currently
        # generate src/version_str.cyr (sandhi pattern, not yet adopted
        # here), so this is a simpler check than sandhi's three-way.
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME#v}"   # strip optional leading 'v'
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag ($TAG) is not semver x.y.z"; exit 1; }
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (VERSION ↔ tag)"

      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -oP '(?<=^cyrius = ")[^"]+' cyrius.cyml)}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib/" 2>/dev/null || true
          chmod +x "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"* 2>/dev/null || true
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/bin"
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" "$HOME/.cyrius/lib"
          echo "$CYRIUS_VERSION" > "$HOME/.cyrius/current"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Resolve deps
        # See ci.yml: the committed cyrius.lock is checked, not rewritten.
        # `cyrius deps` refuses a stdlib snapshot that disagrees with it
        # under the same pin; `--verify` re-checks lib/ against it. The
        # lock ships as a release asset, so it must match what was built.
        run: |
          cyrius deps
          cyrius deps --verify

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/niyama
          echo "niyama: $(wc -c < build/niyama) bytes"

      - name: Cross-build aarch64 (best-effort)
        # Best-effort: ship x86_64 even if aarch64 fails. This probe named
        # only `cc5_aarch64` through 1.0.11. cyrius 6.0.0 renamed it
        # `cycc_aarch64`; the old name survived only as a symlink made by
        # cyrius's install.sh, which the install step above never runs. So
        # from the 6.0.1 pin on the `if` was always false: releases
        # 1.0.3 – 1.0.11 warned, went green, and shipped x86_64 only.
        # Probe order mirrors vidya's release.yml. Verified at the 6.6.6
        # pin: a 573,400-byte static aarch64 ELF that runs under qemu.
        run: |
          CC_AA64=""
          for cand in cycc_aarch64 cycc-native-aarch64 cc5_aarch64; do
            if [ -x "$HOME/.cyrius/bin/$cand" ]; then CC_AA64="$cand"; break; fi
          done
          if [ -n "$CC_AA64" ]; then
            echo "aarch64 backend: $CC_AA64"
            if CYRIUS_DCE=1 cyrius build --aarch64 src/main.cyr build/niyama-aarch64; then
              echo "niyama-aarch64: $(wc -c < build/niyama-aarch64) bytes"
            else
              echo "::warning::aarch64 cross-build failed; shipping x86_64 only"
              rm -f build/niyama-aarch64
            fi
          else
            echo "::warning::no aarch64 backend in this Cyrius — aarch64 binary skipped"
          fi

      - name: Test
        run: cyrius test

      - name: Clean toolchain artifacts
        run: rm -f cyrius-*.tar.gz

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Source tarball — repo snapshot at the tagged commit.
          git archive --format=tar.gz --prefix="niyama-${TAG}/" -o "niyama-${TAG}-src.tar.gz" HEAD
          # Single-include bundle — the fold-ready artifact (sandhi precedent).
          cp dist/niyama.cyr "niyama-${TAG}.cyr"
          # Smoke binaries — consumers can verify link-shape against a
          # known-good build per arch.
          if [ -f build/niyama ]; then
            cp build/niyama "niyama-${TAG}-x86_64-linux"
          fi
          if [ -f build/niyama-aarch64 ]; then
            cp build/niyama-aarch64 "niyama-${TAG}-aarch64-linux"
          fi
          sha256sum niyama-*.tar.gz niyama-*.cyr niyama-*-linux cyrius.lock 2>/dev/null > SHA256SUMS

      # upload-artifact v7 and download-artifact v8 move together: v8 only
      # unzips an artifact stored with a zip Content-Type, which v7 writes
      # and v4 did not.
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            niyama-*.tar.gz
            niyama-*.cyr
            niyama-*-linux
            cyrius.lock
            SHA256SUMS

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
      - name: Extract changelog body for tag
        # Pull the `## [TAG]` section out of CHANGELOG.md so the GH
        # Release body matches the source-of-truth changelog. Mirrors
        # sandhi's release pattern.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
          if [ ! -s /tmp/body.md ]; then
            echo "::warning::no ## [${TAG}] section in CHANGELOG.md — release body will be empty"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          name: "niyama ${{ github.ref_name }}"
          body_path: /tmp/body.md
          # 0.x tags are pre-releases per semver; flip to non-prerelease at 1.0.0
          # (the fold-ready release per ADR 0001).
          prerelease: ${{ startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v0.') }}
          files: |
            niyama-*.tar.gz
            niyama-*.cyr
            niyama-*-linux
            cyrius.lock
            SHA256SUMS
