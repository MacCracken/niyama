# cyrius.lock — niyama
#
# niyama has no external [deps] entries (stdlib-only through M5
# per CLAUDE.md "Rules"), so this lockfile has no hash lines to
# carry. It exists as a non-empty placeholder for two reasons:
#
#   1. Cyrius 6.0.1's `cyrius deps` truncates cyrius.lock to 0
#      bytes when there are no external deps to lock — and the
#      GitHub release-asset API rejects 0-byte uploads with
#      `size must be greater than or equal to 1`. Shipping this
#      stub keeps the lock asset uploadable.
#
#   2. CI / release run `cyrius deps --no-lock` so the toolchain
#      bug never overwrites this file. Drop --no-lock once the
#      lockfile-writer regression is fixed upstream.
#
# Same workaround pattern lives in yukti / patra (which DO have
# external deps in their locks); niyama's variant is comment-only
# because there is nothing to hash.
